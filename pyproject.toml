[project]
name = "voice-realtime"
version = "0.1.0"
description = "全本地实时语音交互 + 实时语音字幕系统 (Apple Silicon / MLX / 中文优先)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "hrygo" }]
keywords = ["realtime", "voice", "asr", "tts", "mlx", "pipecat", "whisper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    # 自研桥核心 (qwen3-tts-openai)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
]

[project.optional-dependencies]
# 实时 TTS 引擎 (mlx-audio Qwen3-TTS) — 重型依赖，独立组
# 注意: misaki[zh] 要求 Python <3.13 → 项目锁 3.12
tts = [
    "mlx-audio[tts]>=0.4.8",
    "misaki[zh]>=0.9.4",
]
# 交互管道 (Pipecat: FunASR STT + LLM + 自定义 TTS) — 重型依赖，独立组
interaction = [
    "pipecat-ai[funasr,silero,openai,soundfile,websocket,local]>=1.0",
    "torch>=2.5",
    "torchaudio>=2.5",
]
# 开发与质量门禁
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest-timeout>=2.3",
    "asgi-lifespan>=2.1",
]

[project.scripts]
vr-bridge = "voice_realtime.tts_bridge.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_realtime"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM",
    "ASYNC", "RUF", "PTH", "RET", "PERF", "TID",
]
# 中文文档/描述中的全角标点（RUF001/002/003）为项目刻意风格，忽略
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN001", "ANN201"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
timeout = 120

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80